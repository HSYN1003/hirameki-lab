          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert sum(x.file_size for x in z.infolist())<5_000_000
              for info in z.infolist():
                  p=PurePosixPath(info.filename)
                  assert not p.is_absolute() and ".." not in p.parts
                  assert p.parts[0] in ("fx_atlas","tests") or str(p) in ("fx-sentiment-data/previous_snapshot.json",".gitignore")
                  target=Path(str(p))
                  if not target.exists():
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(z.read(info))
          print("Source files installed only where absent; original index.html remains untouched.")
          PYCODE
      - name: Test date, value, aggregation and failure handling
        run: python3 -m unittest discover -s tests -v
      - name: Collect public sources (failure remains visible)
        id: collect
        continue-on-error: true
        run: python3 -m fx_atlas.collect --root . --social
      - name: Build atomic data and preserve existing site
        run: |
          test -f fx-sentiment-data/snapshot.json
          python3 -m fx_atlas.render --root . --site _site
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          s=json.loads(Path('fx-sentiment-data/snapshot.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## FX Atlas collection\n\n')
              for p in s['summary']['paragraphs']: f.write(p+'\n\n')
              f.write('Collection success is not freshness or prediction accuracy.\n')
          PY
      - name: Save verified ledger and generated page (not the existing index)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .gitignore fx_atlas tests fx-sentiment-data fx-sentiment.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update FX Atlas evidence and source health'
            git push origin HEAD:main
          fi
      - name: Configure Pages (repository Settings > Pages must use GitHub Actions)
        uses: actions/configure-pages@v5
      - name: Upload site including original homepage
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Explicit Pages deployment (GITHUB_TOKEN pushes do NOT trigger Pages)
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Mark failed collection after publishing truthful health state
        if: needs.collect.outputs.collection_outcome != 'success'
        run: |
          echo 'The page health report was deployed, but the data collection failed. Inspect source statuses.'
          exit 1
