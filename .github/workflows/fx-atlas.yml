name: FX Atlas hourly collection and Pages
on:
  schedule:
    - cron: '17 * * * *' # UTC; every hour. Alternative: '17 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fx_atlas/**'
      - 'tests/**'
      - '.github/workflows/fx-atlas.yml'
      - 'fx-sentiment-data/consensus-captures.json'
      - 'fx-sentiment-data/reviewed-interpretations.json'
permissions:
  contents: read
concurrency:
  group: fx-atlas-pages
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pages: read
    outputs:
      collection_outcome: ${{ steps.collect.outcome }}
