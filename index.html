<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1020"><title>ひらめきラボ</title><style>
:root{--bg:#080d19;--panel:#121a2e;--panel2:#19233d;--text:#f8faff;--muted:#9aa8c8;--a:#8068ff;--b:#21d4d0;--good:#55e49c;--warn:#ffd166;--line:rgba(255,255,255,.09)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#1b2751 0,#080d19 40%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif}.app{max-width:540px;margin:auto;min-height:100vh;padding:16px 15px 104px}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:950;letter-spacing:.04em}.pill{font-size:12px;padding:8px 11px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;color:#dce3f7}.hero{margin-top:14px;padding:22px;border:1px solid var(--line);border-radius:28px;background:linear-gradient(135deg,rgba(128,104,255,.4),rgba(33,212,208,.14));box-shadow:0 18px 50px rgba(0,0,0,.3)}h1{font-size:31px;margin:0 0 7px}.hero p,.sub{color:var(--muted);line-height:1.65}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.stat,.card{background:rgba(18,26,46,.96);border:1px solid var(--line);border-radius:22px}.stat{padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.card{padding:18px;margin-top:13px}.btn{border:0;border-radius:17px;padding:14px 16px;font-weight:900;font-size:15px;cursor:pointer}.primary{width:100%;color:#fff;background:linear-gradient(135deg,var(--a),#a16bff);box-shadow:0 10px 28px rgba(128,104,255,.32)}.secondary{background:var(--panel2);color:#fff;border:1px solid var(--line)}.ghost{background:transparent;color:var(--muted)}.row{display:flex;gap:9px;margin-top:11px}.row>*{flex:1}.mode{font-size:12px;color:var(--b);font-weight:900;letter-spacing:.1em}.prompt{font-size:27px;font-weight:950;line-height:1.38;margin:12px 0}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:13px 0}.chip{font-size:12px;padding:8px 10px;border-radius:999px;background:#202b49;border:1px solid var(--line)}textarea{width:100%;min-height:102px;resize:vertical;background:#0d1427;color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:14px;font-size:17px;outline:none}.score{font-size:61px;text-align:center;font-weight:950}.meter{height:9px;border-radius:999px;background:#0b1223;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:999px}.feedback{padding:14px;border-radius:16px;background:#0e1629;line-height:1.65;margin-top:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.mini{background:#0e1629;border-radius:15px;padding:12px}.mini b{display:block;font-size:18px}.mini span,small{font-size:11px;color:var(--muted)}.hidden{display:none!important}.nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:min(510px,calc(100% - 22px));display:grid;grid-template-columns:repeat(4,1fr);padding:7px;background:rgba(13,20,39,.9);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:20px}.nav button{border:0;background:transparent;color:var(--muted);padding:9px 2px;border-radius:13px;font-weight:800}.nav button.active{background:rgba(255,255,255,.07);color:#fff}.item{padding:14px;background:#0e1629;border-radius:16px;margin-top:9px}.achievement{display:flex;gap:10px;align-items:center}.achievement .icon{font-size:26px}.lock{opacity:.42}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#111a30;border:1px solid var(--line);padding:11px 15px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:4px}.tabs button{white-space:nowrap}.bigword{font-size:32px;font-weight:950}.tagline{font-size:13px;color:#cbd5ef;margin-top:5px}
</style></head><body><div class="app">
<section id="homeView"><div class="top"><div class="brand">🧠 ひらめきラボ</div><div id="levelBadge" class="pill"></div></div><div class="hero"><h1>例え力を、遊びに。</h1><p>問題数は無制限。お題・構造・縛り・ワードを組み替え、同じ問題をほぼ出さずに生成します。</p></div><div class="stats"><div class="stat"><b id="plays">0</b><span>プレイ</span></div><div class="stat"><b id="avg">--</b><span>平均点</span></div><div class="stat"><b id="best">--</b><span>最高点</span></div></div><button id="start" class="btn primary">▶ 無限プレイを始める</button><div class="card"><div class="mode">TODAY'S BOOST</div><div class="bigword" id="dailyTheme"></div><div class="tagline">今日はこの感情のお題が少し多めに出ます</div></div><div class="card"><div class="mode">遊び方</div><p class="sub">短く答える → 5能力で採点 → 別解を見る → 次へ。終了ボタンを押すまで、何問でも続きます。</p></div></section>
<section id="gameView" class="hidden"><div class="top"><button id="quit" class="btn ghost">← 終了</button><div id="streak" class="pill"></div></div><div id="qcard" class="card"><div id="mode" class="mode"></div><div id="prompt" class="prompt"></div><div id="instruction" class="sub"></div><div id="chips" class="chips"></div><textarea id="answer" maxlength="80" placeholder="思いついたまま、短く入力"></textarea><div class="row"><button id="skip" class="btn secondary">スキップ</button><button id="submit" class="btn primary">採点する</button></div></div><div id="result" class="card hidden"><div id="score" class="score"></div><div class="meter"><i id="scorebar"></i></div><div id="feedback" class="feedback"></div><div id="metrics" class="grid2"></div><div class="card" style="margin-top:12px"><div class="mode">別解サンプル</div><div id="examples"></div></div><div class="row"><button id="save" class="btn secondary">♡ 傑作保存</button><button id="next" class="btn primary">次の問題</button></div></div></section>
<section id="collectionView" class="hidden"><div class="top"><div><div class="brand">傑作コレクション</div><small id="savedCount"></small></div></div><div id="collection"></div></section>
<section id="profileView" class="hidden"><div class="top"><div class="brand">能力レポート</div><div id="profileTitle" class="pill"></div></div><div id="abilities" class="card"></div><div class="card"><div class="mode">実績</div><div id="achievements"></div></div><button id="reset" class="btn ghost" style="width:100%;margin-top:15px">データを初期化</button></section>
<section id="aboutView" class="hidden"><div class="top"><div class="brand">無限生成の仕組み</div></div><div class="card"><p class="sub">固定問題集ではありません。感情・状況・対象ジャンル・例えの型・禁止条件・指定ワードを毎回組み合わせ、直近150問の履歴と照合して重複を避けます。</p><div id="comboCount" class="bigword"></div><div class="tagline">理論上の主要組み合わせ数</div></div></section>
</div><nav class="nav"><button data-view="home" class="active">ホーム</button><button data-view="collection">傑作</button><button data-view="profile">能力</button><button data-view="about">仕組み</button></nav><div id="toast" class="toast"></div>
<script>
const FEELINGS=['ドキドキ','納得できない','気まずい','うれしい','焦る','疲れた','イライラ','めんどい','びっくり','安心した','説得力がある','意味不明','かっこいい','寂しい','不安','悔しい','テンションが上がる','恥ずかしい'];
const STRUCTURES={ 'ドキドキ':['突然','期待','失敗が怖い'],'納得できない':['あと一歩','大事なものが欠ける','もどかしい'],'気まずい':['沈黙','逃げ場がない','互いに意識'],'うれしい':['解放','幸運','報われる'],'焦る':['時間切れ','制御不能','迫ってくる'],'疲れた':['動けない','使い切った','終わりが見えない'],'イライラ':['小さな妨害','繰り返す','思い通りにならない'],'めんどい':['手順が多い','割に合わない','先延ばししたい'],'びっくり':['予想外','急変','大きな差'],'安心した':['危機回避','元に戻る','緊張が解ける'],'説得力がある':['反論できない','重みがある','全員が止まる'],'意味不明':['因果がない','組み合わせが異常','説明不能'],'かっこいい':['圧倒','姿勢がいい','周囲が反応'],'寂しい':['空白','取り残される','反応がない'],'不安':['先が見えない','確証がない','悪い予感'],'悔しい':['あと少し','負けを認めたくない','やり直したい'],'テンションが上がる':['予想以上','解禁','勢いが出る'],'恥ずかしい':['注目される','隠したい','逃げたい']};
const DOMAINS=['学校','仕事','恋愛','食べ物','家電','ゲーム','スポーツ','動物','宇宙','交通','歴史','コンビニ','病院','天気','お金','SNS','旅行','将棋'];
const WORDS=['ギャル','ラスボス','校長先生','カレー','スプーン','Wi‑Fi','充電1%','裁判官','非常口','雷','彫刻','自販機','冷凍庫','ドラム缶','カラス','宇宙服','たこ焼き','消しゴム','改札','レジ','パンダ','金庫','補助線','勇者','エレベーター','回転寿司','工事現場','リモコン','パスワード','目覚まし時計'];
const PATTERNS=['「{feeling}」を{domain}で例える','「{feeling}」を{domain}以外で例える','＿＿＿＿くらい{feeling}','＿＿＿＿かと思った','{word}を使って「{feeling}」を例える','「{feeling}」を15文字以内で例える','「{feeling}」を大げさに例える','「{feeling}」を日常の小さな出来事で例える'];
const COMMON_SETS=[['猫','飛行機','イヤホン'],['カレー','会議','恋愛'],['傘','パスワード','空気'],['冷蔵庫','先生','信号'],['財布','スマホ','自信'],['電車','告白','電子レンジ'],['将棋','料理','会話'],['雨','宿題','既読']];
const EXEMPLARS={short:['月曜一限','ラスボスの登場','国宝','閉店後の店員'],structure:['カレーなのにスプーンがない','充電99%で止まる','最後のピースだけ裏返し'],vivid:['非常口まで振り返る','雷が弟子入りする','校長先生だけWi‑Fi'],common:['必要なときに限って見つからない','扱い方に性格が出る','混ぜすぎると戻れない']};
const $=x=>document.getElementById(x);let state=JSON.parse(localStorage.getItem('hiramekiV1')||'{"plays":[],"saved":[],"recent":[],"abilities":{"抽象化":0,"構造一致":0,"遠距離連想":0,"ワードセンス":0,"映像性":0}}'),current,lastResult,run=0;
function persist(){localStorage.setItem('hiramekiV1',JSON.stringify(state))}function pick(a){return a[Math.floor(Math.random()*a.length)]}function dayTheme(){return FEELINGS[new Date().getDate()%FEELINGS.length]}function title(n){return n>=200?'言葉の魔術師':n>=100?'比喩マスター':n>=50?'発想職人':n>=20?'コピーライター見習い':n>=5?'例え初心者':'連想ビギナー'}function level(){return Math.floor(state.plays.length/5)+1}
function makeQuestion(){let q,key,tries=0;do{tries++;const type=Math.random()<.14?'common':Math.random()<.3?'gacha':'analogy';if(type==='common'){const set=pick(COMMON_SETS);q={type,mode:'共通点パズル',prompt:set.join('・'),instruction:'3つすべてに通じる共通点を、できるだけ抽象的に答えてください。',chips:['構造を見る','具体すぎない'],examples:EXEMPLARS.common};}else{let feeling=Math.random()<.18?dayTheme():pick(FEELINGS),domain=pick(DOMAINS),word=pick(WORDS),pattern=pick(PATTERNS);let prompt=pattern.replaceAll('{feeling}',feeling).replaceAll('{domain}',domain).replaceAll('{word}',word);q={type,mode:type==='gacha'?'ワードガチャ':'構造ハンター',prompt,instruction:'意味が通る範囲で、意外なジャンルへ飛ばしてください。',chips:type==='gacha'?[word,...STRUCTURES[feeling].slice(0,2)]:STRUCTURES[feeling],examples:[...EXEMPLARS.structure,...EXEMPLARS.vivid].sort(()=>Math.random()-.5).slice(0,3),feeling,word};}key=q.mode+'|'+q.prompt;}while(state.recent.includes(key)&&tries<40);state.recent.push(key);state.recent=state.recent.slice(-150);persist();return q;}
function scoreAnswer(ans){const t=ans.replace(/\s/g,''),len=t.length;const strong=WORDS.filter(w=>t.includes(w)).length;const forms=['くらい','なのに','かと思','だけ','まで','ほど','のに','急に','残り','最後'];const form=forms.some(w=>t.includes(w));let base=43+Math.min(20,Math.floor(len/2))+strong*7+(form?9:0)+(len<=22?7:0);if(current.type==='gacha'&&t.includes(current.word))base+=9;if(current.type==='common'&&len>=7)base+=8;base+=Math.floor(Math.random()*9)-4;const score=Math.max(38,Math.min(99,base));const m={構造一致:Math.min(99,score+(form?5:0)),意外性:Math.max(30,Math.min(99,score+strong*4+Math.floor(Math.random()*9)-5)),映像性:Math.max(30,Math.min(99,score+strong*5)),短さ:Math.max(35,Math.min(99,100-Math.max(0,len-16)*2)),ワードセンス:Math.max(30,Math.min(99,score+Math.floor(Math.random()*11)-5))};return{score,metrics:m}}
function fb(r){return r.score>=90?'一撃で映像が浮かびます。構造も短さもかなり強い回答です。':r.score>=80?'意味が通り、意外性もあります。さらに名詞を強くすると傑作圏です。':r.score>=70?'構造は伝わっています。説明を削って、強い名詞を一つ残しましょう。':'似ているポイントを一つに絞り、別ジャンルの具体物へ置き換えると伸びます。'}
function show(v){['home','game','collection','profile','about'].forEach(x=>$(x+'View').classList.toggle('hidden',x!==v));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));if(v==='home')home();if(v==='collection')collection();if(v==='profile')profile()}
function home(){const p=state.plays,s=p.length?Math.round(p.reduce((a,b)=>a+b.score,0)/p.length):'--',b=p.length?Math.max(...p.map(x=>x.score)):'--';$('plays').textContent=p.length;$('avg').textContent=s;$('best').textContent=b;$('levelBadge').textContent=`Lv.${level()} ${title(p.length)}`;$('dailyTheme').textContent=dayTheme();$('comboCount').textContent=(FEELINGS.length*DOMAINS.length*WORDS.length*PATTERNS.length+COMMON_SETS.length).toLocaleString()+'通り以上'}
function next(){current=makeQuestion();$('mode').textContent=current.mode.toUpperCase();$('prompt').textContent=current.prompt;$('instruction').textContent=current.instruction;$('chips').innerHTML=current.chips.map(x=>`<span class="chip">${x}</span>`).join('');$('answer').value='';$('qcard').classList.remove('hidden');$('result').classList.add('hidden');$('streak').textContent=`RUN ${++run}`;setTimeout(()=>$('answer').focus(),100)}
function submit(){const a=$('answer').value.trim();if(!a)return toast('回答を入力してください');const r=scoreAnswer(a);lastResult={...r,answer:a,...current};state.plays.push({score:r.score,date:Date.now(),mode:current.mode});for(const [k,v] of Object.entries({'構造一致':r.metrics.構造一致,'遠距離連想':r.metrics.意外性,'映像性':r.metrics.映像性,'ワードセンス':r.metrics.ワードセンス,'抽象化':current.type==='common'?r.score:Math.round(r.score*.72)}))state.abilities[k]+=v;persist();$('qcard').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=r.score+'点';$('scorebar').style.width=r.score+'%';$('feedback').textContent=fb(r);$('metrics').innerHTML=Object.entries(r.metrics).map(([k,v])=>`<div class="mini"><b>${v}</b><span>${k}</span></div>`).join('');$('examples').innerHTML=current.examples.map(x=>`<div class="item">${x}</div>`).join('');$('save').textContent='♡ 傑作保存'}
function save(){if(!lastResult)return;state.saved.unshift({answer:lastResult.answer,prompt:lastResult.prompt,score:lastResult.score,mode:lastResult.mode,date:Date.now()});state.saved=state.saved.slice(0,300);persist();$('save').textContent='♥ 保存済み';toast('傑作に保存しました')}
function collection(){ $('savedCount').textContent=state.saved.length+'件';$('collection').innerHTML=state.saved.length?state.saved.map((x,i)=>`<div class="item"><small>${x.mode}・${x.score}点</small><div style="font-size:19px;font-weight:900;margin:6px 0">${x.answer}</div><small>${x.prompt}</small><button class="btn ghost" style="float:right;padding:0" onclick="del(${i})">削除</button></div>`).join(''):'<div class="card sub">まだ傑作はありません。</div>'}window.del=i=>{state.saved.splice(i,1);persist();collection()}
function profile(){const n=Math.max(1,state.plays.length);$('profileTitle').textContent=title(state.plays.length);$('abilities').innerHTML=Object.entries(state.abilities).map(([k,v])=>{let x=Math.min(99,Math.round(v/n));return`<div style="margin:13px 0"><div style="display:flex;justify-content:space-between"><b>${k}</b><span>${x}</span></div><div class="meter" style="margin-top:7px"><i style="width:${x}%"></i></div></div>`}).join('');const ac=[['最初の一歩','1問プレイ',1],['連想ランナー','20問プレイ',20],['百本ノック','100問プレイ',100],['神回答','95点以上を獲得',95,'score'],['収集家','傑作を10件保存',10,'saved']];$('achievements').innerHTML=ac.map(([a,b,v,t])=>{let ok=t==='score'?state.plays.some(x=>x.score>=v):t==='saved'?state.saved.length>=v:state.plays.length>=v;return`<div class="item achievement ${ok?'':'lock'}"><div class="icon">${ok?'🏆':'🔒'}</div><div><b>${a}</b><div class="sub">${b}</div></div></div>`}).join('')}
function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1300)}
$('start').onclick=()=>{show('game');next()};$('quit').onclick=()=>show('home');$('skip').onclick=next;$('submit').onclick=submit;$('next').onclick=next;$('save').onclick=save;$('reset').onclick=()=>{if(confirm('プレイ履歴と傑作をすべて削除しますか？')){localStorage.removeItem('hiramekiV1');location.reload()}};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.view));home();
</script></body></html>
